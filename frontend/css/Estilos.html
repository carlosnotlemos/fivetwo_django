<style>
  :root {
    /* Paleta Dark Futurista */
    --bg-app: #030712;
    /* Fundo quase preto */
    --bg-sidebar: #111827;
    /* Lateral ligeiramente mais clara */
    --bg-card: #1f2937;
    /* Superfície dos cards */
    --text-main: #f3f4f6;
    /* Texto quase branco */
    --text-muted: #9ca3af;
    /* Texto secundário cinza */
    --border: rgba(255, 255, 255, 0.06);
    /* Bordas sutis */

    /* Cores de Sotaque Neon */
    --primary: #8b5cf6;
    /* Violeta Neon */
    --primary-dim: rgba(139, 92, 246, 0.1);
    --cyan: #22d3ee;
    /* Cyan Neon para realces */
    --success: #10b981;
    --error: #ef4444;

    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-app);
    color: var(--text-main);
    margin: 0;
    padding: 0;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* --- LAYOUT PRINCIPAL (Sidebar + Content) --- */

  .sidebar {
    width: 260px;
    background-color: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px;
    justify-content: space-between;
  }

  .main-content {
    flex: 1;
    overflow-y: auto;
    padding: 40px;
    background-image:
      radial-gradient(at 10% 10%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
      radial-gradient(at 90% 90%, rgba(34, 211, 238, 0.08) 0px, transparent 50%);
  }

  /* --- SIDEBAR STYLES --- */

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    font-weight: 700;
    color: var(--text-main);
    padding-bottom: 30px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 30px;
  }

  .brand-icon {
    color: var(--primary);
    filter: drop-shadow(0 0 8px var(--primary));
  }

  .nav-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .nav-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 12px 15px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: var(--transition);
  }

  .nav-btn i {
    font-size: 16px;
    width: 20px;
    text-align: center;
  }

  .nav-btn:hover {
    background-color: rgba(255, 255, 255, 0.03);
    color: var(--text-main);
  }

  .nav-btn.active {
    background-color: var(--primary-dim);
    color: var(--primary);
    border: 1px solid rgba(139, 92, 246, 0.3);
    font-weight: 600;
  }

  .sidebar-footer {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  /* --- CONTEÚDO PRINCIPAL (Cards e Form) --- */

  .page-header {
    margin-bottom: 35px;
  }

  .page-header h1 {
    margin: 0 0 8px 0;
    font-size: 28px;
    font-weight: 700;
  }

  .page-subtitle {
    color: var(--text-muted);
    font-size: 16px;
    margin: 0;
  }

  .tab-content {
    display: none;
    animation: pageIn 0.4s ease-out;
  }

  .tab-content.active {
    display: block;
  }

  @keyframes pageIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .glass-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
  }

  /* --- ESTILIZAÇÃO DE FORMULÁRIOS --- */

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group.full-width {
    grid-column: 1 / -1;
  }

  label {
    display: block;
    margin-bottom: 10px;
    font-weight: 500;
    font-size: 13px;
    color: var(--cyan);
    /* Sotaque Cyan nas labels */
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  input,
  select,
  textarea {
    width: 100%;
    padding: 14px;
    background-color: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-main);
    font-family: inherit;
    font-size: 14px;
    transition: var(--transition);
  }

  input:focus,
  select:focus,
  textarea:focus {
    border-color: var(--primary);
    outline: none;
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    background-color: rgba(0, 0, 0, 0.3);
  }

  textarea {
    resize: vertical;
  }

  /* --- BOTÕES E LOADING --- */

  .btn-container {
    margin-top: 30px;
    display: flex;
    justify-content: flex-start;
  }

  button.prime-btn {
    background: linear-gradient(135deg, var(--primary) 0%, #6d28d9 100%);
    color: white;
    border: none;
    padding: 14px 30px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }

  button.prime-btn:hover:not(:disabled) {
    box-shadow: 0 0 15px var(--primary);
    transform: translateY(-1px);
  }

  button.prime-btn:disabled {
    background: #4b5563;
    cursor: not-allowed;
    opacity: 0.7;
  }

  /* Spinner de Carregamento Futurista */
  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 0.8s linear infinite;
    display: none;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  button.loading .spinner {
    display: inline-block;
  }

  button.loading .btn-icon {
    display: none;
  }

  /* --- NOTIFICAÇÕES (TOASTS) --- */

  .status-panel {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .toast {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 15px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    gap: 12px;
    transform: translateX(120%);
    transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
  }

  .toast.show {
    transform: translateX(0);
  }

  .toast.success {
    border-left: 4px solid var(--success);
  }

  .toast.error {
    border-left: 4px solid var(--error);
  }

  .toast i {
    font-size: 18px;
  }

  .toast.success i {
    color: var(--success);
  }

  .toast.error i {
    color: var(--error);
  }

  /* Customização da barra de rolagem */
  ::-webkit-scrollbar {
    width: 8px;
  }

  ::-webkit-scrollbar-track {
    background: var(--bg-app);
  }

  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: var(--text-muted);
  }
</style>
